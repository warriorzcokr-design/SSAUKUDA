# 싸우쿠다 홈페이지 - 저장(커밋)할 때마다 검색용 페이지를 만들어 자동으로 올립니다.
name: 홈페이지 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 깃허브 컴퓨터에 이미 설치된 크롬을 사용해서 빠르게 만듭니다.
      PW_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # 홈페이지 대표 주소 (검색엔진에 알려 주는 주소)
      SITE_URL: https://ssaukuda.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 브라우저 준비
        run: npm install --no-save --no-audit --no-fund playwright@1.56.0
      - name: 검색용 페이지 만들기
        run: node build/prerender.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
